meta:
  name:
    short: BrickCraft
    full: BrickCraft Studios
  link:
    home: https://www.brickcraftstudios.com

logo:
  # Note: Logo files should be placed in the logos/ directory
  # Download or create brand-appropriate logo images and place them next to this file
  images:
    header: logos/header-logo.png  # Horizontal logo for headers
    icon: logos/icon.png            # Small square icon
  small: icon
  medium: header
  large: header

color:
  palette:
    # Classic LEGO-inspired color palette
    brick-red: "#D01012"      # Iconic LEGO red
    bright-yellow: "#FFD700"   # LEGO yellow
    classic-blue: "#0055BF"    # LEGO blue
    creative-green: "#00A651"  # Bright green for creativity
    play-orange: "#FF8C00"     # Vibrant orange
    build-white: "#FFFFFF"     # Clean white
    construct-black: "#1A1A1A" # Deep black
    light-gray: "#E8E8E8"      # Light gray for backgrounds
    mid-gray: "#6B6B6B"        # Medium gray for secondary text

  foreground: construct-black
  background: build-white
  primary: brick-red
  secondary: classic-blue
  tertiary: light-gray
  success: creative-green
  info: classic-blue
  warning: play-orange
  danger: brick-red
  light: build-white
  dark: construct-black

typography:
  fonts:
    - family: Inter
      source: google
      weight: [400, 600, 700]
      style: [normal]
    - family: Poppins
      source: google
      weight: [600, 700, 800]
      style: [normal]
    - family: Fira Code
      source: google
      weight: [400, 500]
      style: [normal]

  base:
    family: Inter
    weight: 400
    size: 16px
    line-height: 1.6

  headings:
    family: Poppins
    weight: 700
    style: normal
    line-height: 1.2
    color: construct-black

  monospace:
    family: Fira Code
    weight: 400
    size: 0.9em

  monospace-inline:
    color: classic-blue
    background-color: light-gray

  link:
    color: brick-red
    weight: 600
    decoration: none
